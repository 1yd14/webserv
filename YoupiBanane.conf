server {
    listen 8080;
    host 127.0.0.1;
    root ./www;
    index index.html;

    location / {
        methods GET;
    }

    location /bla {
        methods POST;
        cgi_extension .bla;
    }

    location /post_body {
        methods POST;
        max_body_size 100;
    }

    location /directory/ {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }
}
