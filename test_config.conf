server {
    listen          8080;
    host            127.0.0.1;
    root            /home/rmhazres/Desktop/webserv/var/www/html;
    index           index.html;
    max_body_size   10M;

    error_page  404  /home/rmhazres/Desktop/webserv/var/www/errors/404.html;
    error_page  500   /home/rmhazres/Desktop/webserv/var/www/errors/500.html;

    location / {
        methods     GET POST;
        autoindex   off;
        index       index.html;
    }

    location /files {
        methods     GET;
        root        /home/rmhazres/Desktop/webserv/var/www/html/files;
        autoindex   on;
    }

    location /upload {
        methods     POST DELETE;
        upload_dir   /home/rmhazres/Desktop/webserv/var/www/uploads;
    }

    location /old-page {
        redirect    301  /new-page;
    }


    location /kapouet {
        methods     GET;
        root        /tmp/www;
        autoindex   off;
    }

    location /cgi-bin {
        methods         GET POST;
        cgi_extension   .py;
        root            /home/rmhazres/Desktop/webserv/var/www/cgi-bin;
    }
}

