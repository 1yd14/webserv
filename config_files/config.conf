server {
    listen          8080;
	listen			8081;
	host			localhost;

    root            ../var/www/html;
    index           index.html;
    max_body_size   10M;

    error_page  404  ../var/www/errors/404.html;
    error_page  500   ../var/www/errors/500.html;
    error_page  504   ../var/www/errors/504.html;


    location / {
        methods     GET POST;
        autoindex   off;
        index       index.html;
	}

    location /files {
        methods     GET;
        root        ../var/www/html/files;
        autoindex   on;
    }

    location /upload {
        methods     POST DELETE;
        upload_dir   ../var/www/uploads;
    }

    location /old-page {
        redirect    301  /new-page;
	}

    location /cgi-bin/php {
        methods         GET POST;
        cgi_extension   .php;
        root            ../var/www/cgi-bin/php;
    }

	location /cgi-bin/python {
        methods         GET POST;
        cgi_extension   .py;
        root            ../var/www/cgi-bin/python;
    }
}

